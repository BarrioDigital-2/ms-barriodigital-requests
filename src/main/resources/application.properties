server.port=8081
server.address=${SERVER_ADDRESS:0.0.0.0}

azure.tenant-id=${AZURE_TENANT_ID:92b9ffd8-4da1-4956-b85b-62654b654d25}
azure.api-client-id=${AZURE_API_CLIENT_ID:8b0cc19f-2671-49c7-beff-816087690691}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id}/v2.0

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barriodigital}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# ========== RABBITMQ (publicacion de eventos) ==========
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:barriodigital}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:barrio2026Rabbit}

# ========== KAFKA (streaming de eventos) ==========
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

# --- Topic principal de eventos ---
app.kafka.topic.requests-events=requests.events
app.kafka.topic.replicas=${KAFKA_TOPIC_REPLICAS:1}
