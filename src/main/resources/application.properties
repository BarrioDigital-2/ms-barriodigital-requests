server.port=8081
server.address=${SERVER_ADDRESS:0.0.0.0}

azure.tenant-id=${AZURE_TENANT_ID:REPLACE_AZURE_TENANT_ID}
azure.api-client-id=${AZURE_API_CLIENT_ID:REPLACE_AZURE_CLIENT_ID}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id}/v2.0

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barriodigital}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
